[project]
name = "termpaws-backend"
version = "0.9.15"
description = "TermPaws backend server (FastAPI + embedded robot bridge)"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "python-multipart<1.0.0,>=0.0.7",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>2.0",
    "emails<1.0,>=0.6",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx<1.0.0,>=0.25.1",
    "python-socketio>=5.0.0",
    "websocket-client>=1.6.4",
    "nonebot2[fastapi,httpx,websockets]>=2.5.0",
    "nonebot-adapter-qq>=1.6.7",
    "nonebot-adapter-telegram>=0.1.0b20",
    "nonebot-adapter-discord>=1.1.6",
    "nonebot-plugin-alconna>=0.62.0",
    "nonebot-adapter-onebot>=2.4.6",

    "sqlmodel<1.0.0,>=0.0.21",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
    "pyjwt<3.0.0,>=2.8.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "litellm>=1.0.0,!=1.82.7,!=1.82.8",
    "pyyaml>=6.0.0",
    "fastembed>=0.4.0",
    "chromadb>=0.4.0",
]

[project.optional-dependencies]
adapters = [
    "nonebot-adapter-satori>=1.3.0",
    "nonebot-adapter-red>=0.9.0",
    "nonebot-adapter-dodo>=0.2.1",
    "nonebot-adapter-github>=0.6.0",
    "nonebot-adapter-wxmp>=0.1.8",
    "nonebot-adapter-minecraft>=1.8.0",
    "nonebot-adapter-vocechat>=0.1.8",
    "nonebot-adapter-yunhu>=0.1.6",
    "nonebot-adapter-mirai>=2.3.3",
    "nonebot-adapter-mail>=1.0.0a7",
]

[dependency-groups]
dev = [
    "pytest<8.0.0,>=7.4.3",
    "mypy<2.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "prek>=0.2.24,<1.0.0",
    "coverage<8.0.0,>=7.4.3",
]

[project.scripts]
termpaws = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "alembic.ini"
"skills" = "app/skills"
"knowledge" = "app/knowledge"
"bundled_fastembed_cache" = "app/bundled_fastembed_cache"
"mcp_servers.json" = "app/mcp_servers.json"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.per-file-ignores]
"app/cli.py" = ["T201"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true


