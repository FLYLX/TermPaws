[project]
name = "termpaws"
version = "0.9.22"
description = "TermPaws all-in-one: backend + frontend (install this to get everything)"
requires-python = ">=3.10,<4.0"
dependencies = [
    "termpaws-backend==0.9.22",
    "termpaws-frontend==0.9.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
