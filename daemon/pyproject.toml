[project]
name = "termpaws-daemon"
version = "0.8.1"
description = "TermPaws Daemon Service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.1,<1.0",
    "python-socketio>=5.10.0,<6.0",
    "python-dotenv>=1.0.0,<2.0",
    "uvicorn>=0.24.0,<1.0",
    "shellingham>=1.5.4,<2.0",
    "requests>=2.31.0,<3.0",
    "chardet>=5.2.0,<6.0",
    "python-multipart>=0.0.6,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3,<8.0",
    "black>=23.11.0,<24.0",
    "flake8>=6.1.0,<7.0",
]

[project.scripts]
termpaws-daemon = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
